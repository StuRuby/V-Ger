name: Evolve Auto

on:
  workflow_dispatch:
    inputs:
      objective:
        description: "Evolution objective for this run (leave empty to auto-generate from benchmark history)"
        required: false
  schedule:
    - cron: "0 */3 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: v-ger-evolve-auto
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git Identity
        run: |
          git config user.name "v-ger-bot"
          git config user.email "v-ger-bot@users.noreply.github.com"

      - name: Run Evolution Loop
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OBJECTIVE="${{ github.event.inputs.objective }}"
          node dist/scripts/evolve-loop.js \
            --rounds 1 \
            ${OBJECTIVE:+--objective "$OBJECTIVE"} \
            --branch "evolve/auto" \
            --max-round-minutes 120 \
            --max-retries 5 \
            --circuit-breaker 5

      - name: Push Evolution Branch
        run: git push origin evolve/auto

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base feat/init \
            --head evolve/auto \
            --title "chore(evolve): auto round $(date -u +%Y%m%d-%H%M%S)" \
            --body "Automated evolution round. Check workflow artifacts for benchmark report before merging." \
          || echo "PR already open — skipping."

      - name: Upload Benchmark Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: artifacts/benchmarks/
          retention-days: 30
